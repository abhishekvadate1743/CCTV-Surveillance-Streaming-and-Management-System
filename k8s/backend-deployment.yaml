apiVersion: apps/v1
kind: Deployment
metadata:
  name: cctv-backend
  namespace: cctv
  labels:
    app: cctv-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cctv-backend
  template:
    metadata:
      labels:
        app: cctv-backend
        version: v1
    spec:
      containers:
      - name: backend
        image: abhishekvadate1743/cctv-backend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: cctv-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cctv-secrets
              key: jwt-secret
        - name: REDIS_URL
          value: "redis://cctv-redis:6379"
        - name: CORS_ORIGIN
          value: "https://cctv-app.example.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      imagePullSecrets:
      - name: dockerhub-secret

---
apiVersion: v1
kind: Service
metadata:
  name: cctv-backend
  namespace: cctv
  labels:
    app: cctv-backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: cctv-backend
